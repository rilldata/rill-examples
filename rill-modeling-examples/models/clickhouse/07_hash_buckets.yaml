# Scenario: partition overwrite by stable hash bucket when time prefixes are highly skewed.
# Each bucket query scans the S3 prefix, so prefer time partitions when available.
type: model
name: clickhouse_07_hash_buckets
connector: clickhouse
incremental: true
change_mode: patch
materialize: true
partitions_concurrency: 4

refresh:
  cron: "0 1 * * *"
  time_zone: UTC
  # disable: true

# Production SQL-based partition discovery creates sixteen stable buckets.
partitions:
  connector: clickhouse
  sql: SELECT number AS bucket_id FROM numbers(16)

sql: |
  SELECT
    CAST(event_id AS UUID) AS event_id,
    CAST(event_time AS DateTime64(3, 'UTC')) AS event_time,
    toDate(event_time) AS event_date,
    CAST(updated_at AS DateTime64(3, 'UTC')) AS updated_at,
    CAST(user_id AS UInt64) AS user_id,
    CAST(region AS String) AS region,
    CAST(event_type AS String) AS event_type,
    CAST(cityHash64(toString(event_id)) % 16 AS UInt8) AS bucket_id,
    CAST(revenue AS Decimal(18, 4)) AS revenue
  FROM s3(
    's3://example-bucket/analytics/events/dt=*/hour=*/*.parquet',
    '{{ .env.AWS_ACCESS_KEY_ID }}',
    '{{ .env.AWS_SECRET_ACCESS_KEY }}',
    'Parquet'
  )
  WHERE cityHash64(toString(event_id)) % 16 = {{ .partition.bucket_id }}

dev:
  change_mode: reset
  partitions:
    connector: clickhouse
    sql: SELECT number AS bucket_id FROM numbers(2)
  sql: |
    SELECT
      CAST(event_id AS UUID) AS event_id,
      CAST(event_time AS DateTime64(3, 'UTC')) AS event_time,
      toDate(event_time) AS event_date,
      CAST(updated_at AS DateTime64(3, 'UTC')) AS updated_at,
      CAST(user_id AS UInt64) AS user_id,
      CAST(region AS String) AS region,
      CAST(event_type AS String) AS event_type,
      CAST(cityHash64(toString(event_id)) % 2 AS UInt8) AS bucket_id,
      CAST(revenue AS Decimal(18, 4)) AS revenue
    FROM s3(
      's3://example-bucket/analytics/events/dt=2026-08-27/hour=*/*.parquet',
      '{{ .env.AWS_ACCESS_KEY_ID }}',
      '{{ .env.AWS_SECRET_ACCESS_KEY }}',
      'Parquet'
    )
    WHERE cityHash64(toString(event_id)) % 2 = {{ .partition.bucket_id }}

output:
  connector: clickhouse
  incremental_strategy: partition_overwrite
  partition_by: bucket_id
  order_by: (bucket_id, event_date, region, event_type, user_id, event_time, event_id)
  primary_key: (bucket_id, event_date, region, event_type, user_id)
  ttl: event_time + INTERVAL 365 DAY DELETE
  query_settings: use_structure_from_insertion_table_in_table_functions = 0
  columns: |
    (
      event_id UUID,
      event_time DateTime64(3, 'UTC'),
      event_date Date,
      updated_at DateTime64(3, 'UTC'),
      user_id UInt64,
      region LowCardinality(String),
      event_type LowCardinality(String),
      bucket_id UInt8,
      revenue Decimal(18, 4),
      INDEX idx_event_id event_id TYPE bloom_filter(0.01) GRANULARITY 4,
      INDEX idx_user_id user_id TYPE bloom_filter(0.01) GRANULARITY 4
    )
