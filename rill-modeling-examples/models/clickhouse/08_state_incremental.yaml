# Scenario: state-based S3 ingestion into ClickHouse when no usable partition exists.
# This scans the S3 prefix to find rows newer than the stored watermark; prefer
# scenarios 01 or 02 for idempotent retries and targeted backfills.
type: model
name: clickhouse_08_state_incremental
connector: clickhouse
incremental: true
change_mode: patch
materialize: true
timeout: 30m

refresh:
  cron: "0 3 * * *"
  time_zone: UTC
  # disable: true

state:
  connector: clickhouse
  sql: SELECT max(updated_at) AS max_updated_at FROM clickhouse_08_state_incremental

sql: |
  SELECT
    CAST(event_id AS UUID) AS event_id,
    CAST(event_time AS DateTime64(3, 'UTC')) AS event_time,
    toDate(event_time) AS event_date,
    CAST(updated_at AS DateTime64(3, 'UTC')) AS updated_at,
    CAST(user_id AS UInt64) AS user_id,
    CAST(region AS String) AS region,
    CAST(event_type AS String) AS event_type,
    CAST(revenue AS Decimal(18, 4)) AS revenue
  FROM s3(
    's3://example-bucket/analytics/events/dt=*/hour=*/*.parquet',
    '{{ .env.AWS_ACCESS_KEY_ID }}',
    '{{ .env.AWS_SECRET_ACCESS_KEY }}',
    'Parquet'
  )
  {{ if incremental }}
  WHERE updated_at >= parseDateTime64BestEffort('{{ .state.max_updated_at }}', 3)
  {{ end }}

dev:
  change_mode: reset
  sql: |
    SELECT
      CAST(event_id AS UUID) AS event_id,
      CAST(event_time AS DateTime64(3, 'UTC')) AS event_time,
      toDate(event_time) AS event_date,
      CAST(updated_at AS DateTime64(3, 'UTC')) AS updated_at,
      CAST(user_id AS UInt64) AS user_id,
      CAST(region AS String) AS region,
      CAST(event_type AS String) AS event_type,
      CAST(revenue AS Decimal(18, 4)) AS revenue
    FROM s3(
      's3://example-bucket/analytics/events/dt=2026-08-27/hour=*/*.parquet',
      '{{ .env.AWS_ACCESS_KEY_ID }}',
      '{{ .env.AWS_SECRET_ACCESS_KEY }}',
      'Parquet'
    )
    {{ if incremental }}
    WHERE updated_at >= parseDateTime64BestEffort('{{ .state.max_updated_at }}', 3)
    {{ end }}

output:
  connector: clickhouse
  incremental_strategy: merge
  engine: ReplacingMergeTree(updated_at)
  partition_by: toYYYYMM(event_date)
  order_by: (event_date, event_id)
  primary_key: (event_date, event_id)
  ttl: event_time + INTERVAL 365 DAY DELETE
  query_settings: use_structure_from_insertion_table_in_table_functions = 0
  columns: |
    (
      event_id UUID,
      event_time DateTime64(3, 'UTC'),
      event_date Date,
      updated_at DateTime64(3, 'UTC'),
      user_id UInt64,
      region LowCardinality(String),
      event_type LowCardinality(String),
      revenue Decimal(18, 4),
      INDEX idx_event_id event_id TYPE bloom_filter(0.01) GRANULARITY 4,
      INDEX idx_user_id user_id TYPE bloom_filter(0.01) GRANULARITY 4
    )
