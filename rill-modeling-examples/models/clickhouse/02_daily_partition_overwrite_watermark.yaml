# Scenario: daily S3 ingestion with partition_overwrite and object-update watermarks.
# The ClickHouse partition is one day, exactly matching each Rill replacement unit.
type: model
name: clickhouse_02_daily_partition_overwrite_watermark
connector: clickhouse
incremental: true
change_mode: patch
materialize: true
partitions_watermark: updated_on
partitions_concurrency: 4
timeout: 30m

refresh:
  cron: "0 2 * * *"
  time_zone: UTC
  # disable: true

# Production partition discovery: one Hive-style dt directory per run unit.
partitions:
  glob:
    connector: s3
    path: s3://example-bucket/analytics/events/dt=*
    partition: directory

sql: |
  WITH toDate(
    extract('{{ .partition.uri }}', 'dt=([0-9]{4}-[0-9]{2}-[0-9]{2})')
  ) AS source_date
  SELECT
    CAST(event_id AS UUID) AS event_id,
    CAST(event_time AS DateTime64(3, 'UTC')) AS event_time,
    source_date AS event_date,
    CAST(updated_at AS DateTime64(3, 'UTC')) AS updated_at,
    CAST(user_id AS UInt64) AS user_id,
    CAST(region AS String) AS region,
    CAST(event_type AS String) AS event_type,
    CAST(revenue AS Decimal(18, 4)) AS revenue
  FROM s3(
    '{{ .partition.uri }}/hour=*/*.parquet',
    '{{ .env.AWS_ACCESS_KEY_ID }}',
    '{{ .env.AWS_SECRET_ACCESS_KEY }}',
    'Parquet'
  )
  WHERE CAST(event_time AS DateTime64(3, 'UTC')) >= toDateTime(source_date, 'UTC')
    AND CAST(event_time AS DateTime64(3, 'UTC')) < toDateTime(source_date, 'UTC') + INTERVAL 1 DAY

prod:
  partitions:
    glob:
      connector: s3
      path: s3://example-bucket/analytics/events/dt=*
      partition: directory
  sql: |
    WITH toDate(
      extract('{{ .partition.uri }}', 'dt=([0-9]{4}-[0-9]{2}-[0-9]{2})')
    ) AS source_date
    SELECT
      CAST(event_id AS UUID) AS event_id,
      CAST(event_time AS DateTime64(3, 'UTC')) AS event_time,
      source_date AS event_date,
      CAST(updated_at AS DateTime64(3, 'UTC')) AS updated_at,
      CAST(user_id AS UInt64) AS user_id,
      CAST(region AS String) AS region,
      CAST(event_type AS String) AS event_type,
      CAST(revenue AS Decimal(18, 4)) AS revenue
    FROM s3(
      '{{ .partition.uri }}/hour=*/*.parquet',
      '{{ .env.AWS_ACCESS_KEY_ID }}',
      '{{ .env.AWS_SECRET_ACCESS_KEY }}',
      'Parquet'
    )
    WHERE CAST(event_time AS DateTime64(3, 'UTC')) >= toDateTime(source_date, 'UTC')
      AND CAST(event_time AS DateTime64(3, 'UTC')) < toDateTime(source_date, 'UTC') + INTERVAL 1 DAY

dev:
  change_mode: reset
  partitions:
    glob:
      connector: s3
      path: s3://example-bucket/analytics/events/dt=2026-08-27
      partition: directory

output:
  connector: clickhouse
  incremental_strategy: partition_overwrite
  partition_by: event_date
  order_by: (event_date, region, event_type, user_id, event_time, event_id)
  primary_key: (event_date, region, event_type, user_id)
  ttl: event_time + INTERVAL 365 DAY DELETE
  query_settings: use_structure_from_insertion_table_in_table_functions = 0
  columns: |
    (
      event_id UUID,
      event_time DateTime64(3, 'UTC'),
      event_date Date,
      updated_at DateTime64(3, 'UTC'),
      user_id UInt64,
      region LowCardinality(String),
      event_type LowCardinality(String),
      revenue Decimal(18, 4),
      INDEX idx_event_id event_id TYPE bloom_filter(0.01) GRANULARITY 4,
      INDEX idx_user_id user_id TYPE bloom_filter(0.01) GRANULARITY 4
    )
