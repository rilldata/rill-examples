# Scenario: the recommended incremental pattern for object storage: one hour prefix per partition, replaced idempotently.
# Source and output: Exports data from S3 into a materialized DuckDB table.
# Flow: glob lists each hour directory; transform_sql turns that listing into a partition key plus a computed watermark.
# Recommended: partition_overwrite for idempotency, change_mode patch for cheap definition changes, and a watermark for late data.
# Strategy: partition_overwrite replaces every row for the hour, so a retried or rewritten prefix never duplicates rows.
# Change behavior: patch adopts a new definition immediately instead of triggering an automatic full-history rebuild.
# Watermark: LEAST(now, hour + 3h) equals now while the hour is inside its lateness window, then freezes at a constant.
# Late data: GREATEST also folds in updated_on, so a prefix rewritten after the window still re-queues that hour.
# Layout assumption: every file under one hour prefix contains only that hour, so event_hour identifies the partition exactly.
# Model YAML reference: https://docs.rilldata.com/reference/project-files/models
# Incremental models guide: https://docs.rilldata.com/developers/build/models/incremental-models
# Partitioned models guide: https://docs.rilldata.com/developers/build/models/partitioned-models
# Retry error reference: https://docs.aws.amazon.com/AmazonS3/latest/API/ErrorResponses.html
# DuckDB S3 reference: https://duckdb.org/docs/stable/core_extensions/httpfs/s3api
type: model
name: s3_01_hourly_partition_overwrite_watermark
connector: duckdb  # DuckDB reads the objects; the s3 connector supplies credentials.
incremental: true  # Track completed partitions and process only new or re-queued partitions.
change_mode: patch  # Recommended: adopt a new definition immediately without an automatic history rebuild.
materialize: true  # Persist the cross-connector result for fast downstream queries.
partitions_watermark: watermark_interval  # Any expression works, not just a listing column: this one advances with the clock, then freezes.
partitions_concurrency: 4  # Maximum partitions processed in parallel; tune to request limits.
timeout: 20m  # Abort one model execution after this duration.

refresh:
  cron: "5 * * * *"  # five minutes after every hour; interpreted in time_zone (production by default). # At 5 minutes past the hour, every hour, every day
  time_zone: UTC  # Prevent host-local timezone differences from shifting the schedule.
  # disable: true  # Uncomment to keep this resource inactive; it ships commented so a copied example runs as-is.

partitions:  # Each leaf hour directory is one independently tracked partition.
  glob:
    connector: s3
    path: s3://example-bucket/analytics/events/dt=*/hour=*
    partition: directory  # Emit directories, not individual files, so one partition covers a whole hour.
    transform_sql: |  # Project only uri and the watermark; keeping updated_on would make it part of the partition identity.
      SELECT
        uri,
        GREATEST(
          CAST(updated_on AS TIMESTAMP),
          LEAST(
            CAST(now() AS TIMESTAMP),
            strptime(
              regexp_extract(uri, 'dt=(\d{4}-\d{2}-\d{2})/hour=(\d{2})', 1) || ' ' ||
              regexp_extract(uri, 'dt=(\d{4}-\d{2}-\d{2})/hour=(\d{2})', 2),
              '%Y-%m-%d %H'
            ) + INTERVAL 3 HOUR
          )
        ) AS watermark_interval
      FROM {{ .table }}

dev:  # Restrict local development to a single known date.
  change_mode: reset  # Rebuild only the small development slice after edits.
  partitions:
    glob:
      connector: s3
      path: s3://example-bucket/analytics/events/dt=2026-08-27/hour=*
      partition: directory
      transform_sql: |  # Project only uri and the watermark; keeping updated_on would make it part of the partition identity.
        SELECT
          uri,
          GREATEST(
            CAST(updated_on AS TIMESTAMP),
            LEAST(
              CAST(now() AS TIMESTAMP),
              strptime(
                regexp_extract(uri, 'dt=(\d{4}-\d{2}-\d{2})/hour=(\d{2})', 1) || ' ' ||
                regexp_extract(uri, 'dt=(\d{4}-\d{2}-\d{2})/hour=(\d{2})', 2),
                '%Y-%m-%d %H'
              ) + INTERVAL 3 HOUR
            )
          ) AS watermark_interval
        FROM {{ .table }}

sql: |
  SELECT
    event_id,
    event_time,
    date_trunc('hour', event_time) AS event_hour,
    updated_at,
    user_id,
    region,
    event_type,
    revenue
  FROM read_parquet('{{ .partition.uri }}/*.parquet', union_by_name = true)

retry:  # Retries apply to transient execution failures, not invalid SQL or schema errors.
  attempts: 5  # Total attempts, including retries after the first failure.
  delay: 10s  # Initial wait between attempts.
  exponential_backoff: true  # Increase the delay after each failed attempt.
  if_error_matches:  # Explicit matches replace Rill defaults; DuckDB surfaces S3 responses as IO and HTTP errors.
    - ".*HTTP 5[0-9]{2}.*"  # S3 or the gateway returned a 5xx response; back off and retry.
    - ".*SlowDown.*"  # S3 request-rate throttling on a hot prefix.
    - ".*RequestTimeout.*"  # The connection to S3 timed out before the object was fully read.
    - ".*InternalError.*"  # S3 reported a transient internal failure.
    - ".*Connection reset by peer.*"  # The TCP connection dropped mid-transfer.

output:
  connector: duckdb
  incremental_strategy: partition_overwrite  # Replace the complete output partition; idempotent for retries.
  partition_by: event_hour  # Column identifying the output rows that partition_overwrite replaces.
