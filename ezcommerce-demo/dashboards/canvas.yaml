# Explore YAML
# Reference documentation: https://docs.rilldata.com/reference/project-files/canvas-dashboards

type: canvas
title: "Canvas Dashboard"
defaults:
  time_range: inf
  comparison_mode: time
rows:
  - items:
      - kpi_grid:
          metrics_view: data_metrics
          measures:
            - total_sales_measure
            - customer_count
            - average_revenue_per
            - cltv
          comparison:
            - delta
            - percent_change
          time_filters: tr=rill-QTD&compare_tr=rill-PP&grain=week
          title: Quarter to Date
        width: 7
      - image:
          url: https://i.imgur.com/pUgSMm6.png
        width: 5
    height: 541px
  - items:
      - donut_chart:
          color:
            field: Category
            limit: 20
            type: nominal
          innerRadius: 50
          labels:
            format: percent
            show: true
            threshold: 5
          measure:
            field: total_sales_measure
            showTotal: true
            type: quantitative
          metrics_view: data_metrics
          show_other: true
        width: 6
      - donut_chart:
          color:
            colorMapping:
              - color: hsl(205, 100%, 65%)
                value: Office Supplies
              - color: hsl(42, 100%, 46%)
                value: Furniture
            field: Category
            limit: 20
            type: nominal
          innerRadius: 50
          labels:
            format: percent
            show: true
            threshold: 5
          measure:
            field: total_profit_measure
            showTotal: true
            type: quantitative
          metrics_view: data_metrics
          show_other: true
        width: 6
    height: 40px
  - items:
      - heatmap:
          color:
            colorRange:
              mode: scheme
              scheme: sequential
            field: max_sales_measure
            type: quantitative
          description: ""
          metrics_view: data_metrics
          title: ""
          x:
            field: Order Date
            limit: 20
            sort: -y
            type: temporal
          y:
            field: Region
            limit: 40
            type: nominal
        width: 12
    height: 40px
  - items:
      - table:
          metrics_view: data_metrics
          columns:
            - Product Name
            - total_sales_measure
          col_dimensions: []
          measures:
            - total_sales_measure
          row_dimensions:
            - Product Name
          title: Top Selling Products (All Time)
          time_filters: tr=inf&grain=month
        width: 7
      - table:
          metrics_view: data_metrics
          columns:
            - Sub-Category
            - total_sales_measure
          col_dimensions: []
          measures:
            - total_sales_measure
          row_dimensions:
            - Sub-Category
          time_filters: tr=rill-QTD&grain=week
          title: Quarter to Date
        width: 5
    height: 321px
  - items:
      - line_chart:
          color:
            type: value
            field: rill_measures
            legendOrientation: top
          metrics_view: data_metrics
          x:
            field: Order Date
            limit: 20
            sort: -y
            type: temporal
          y:
            field: total_sales_measure
            type: quantitative
            zeroBasedOrigin: true
            fields:
              - total_sales_measure
              - total_profit_measure
        width: 6
      - area_chart:
          metrics_view: data_metrics
          color: primary
          x:
            type: temporal
            field: Order Date
            sort: -y
            limit: 20
          y:
            type: quantitative
            field: total_profit_measure
            zeroBasedOrigin: true
        width: 6
    height: 40px
  - items:
      - stacked_bar_normalized:
          metrics_view: data_metrics
          title: ""
          description: ""
          color:
            field: Sub-Category
            type: nominal
          x:
            field: Category
            limit: 20
            sort: -y
            type: nominal
          y:
            field: min_sales_measure
            type: quantitative
            zeroBasedOrigin: true
        width: 6
    height: 380px
time_ranges:
  - inf
  - PT6H
  - PT24H
  - P7D
  - P14D
  - P4W
  - P3M
  - P12M
  - rill-TD
  - rill-WTD
  - rill-MTD
  - rill-QTD
  - rill-YTD
  - rill-PDC
  - rill-PWC
  - rill-PMC
  - rill-PQC
  - rill-PYC
theme:
  colors:
    primary: hsl(110, 58%, 50%)
    secondary: hsl(32, 89%, 50%)
