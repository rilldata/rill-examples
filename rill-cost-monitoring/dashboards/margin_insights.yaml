type: canvas
version: 1

display_name: "Margin Insights"

defaults:
  time_range: P30D
  comparison_mode: time

rows:
  - name: overview
    tabs:
      - label: Customers
        name: customers
        rows:
          - height: 72px
            items:
              - width: 12
                markdown:
                  content: >
                    ## Customers


                    Identify the customers driving net revenue and margin
                    performance.
                  alignment:
                    horizontal: left
                    vertical: middle
          - height: 380px
            items:
              - width: 6
                bar_chart:
                  metrics_view: metrics_margin_metrics
                  title: Top Customers by Net Revenue
                  x:
                    field: customer
                    type: nominal
                    limit: 15
                    sort: -y
                    labelAngle: 0
                  y:
                    field: net_revenue
                    type: quantitative
                    zeroBasedOrigin: true
              - width: 6
                bar_chart:
                  metrics_view: metrics_margin_metrics
                  title: Customers by Gross Margin %
                  x:
                    field: customer
                    type: nominal
                    limit: 15
                    sort: -y
                    labelAngle: 0
                  y:
                    field: gross_margin_percent
                    type: quantitative
                    zeroBasedOrigin: false
          - height: 420px
            items:
              - width: 12
                table:
                  metrics_view: metrics_margin_metrics
                  title: Customer Detail
                  columns:
                    - customer
                    - total_revenue
                    - total_cost
                    - net_revenue
                    - gross_margin_percent
                  hide_totals_row: false
      - label: Cost Drivers
        name: cost_drivers
        rows:
          - items:
              - width: 12
                markdown:
                  content: >
                    ## Cost Drivers


                    Understand which components contribute most to total cost
                    and how they trend over time.
                  alignment:
                    horizontal: left
                    vertical: middle
            height: 72px
          - items:
              - width: 6
                bar_chart:
                  metrics_view: metrics_margin_metrics
                  title: Top Cost Components
                  x:
                    field: component
                    type: nominal
                    limit: 15
                    sort: -y
                    labelAngle: 0
                  y:
                    field: total_cost
                    type: quantitative
                    zeroBasedOrigin: true
              - width: 6
                stacked_bar:
                  metrics_view: metrics_margin_metrics
                  title: Cost Over Time by Component
                  color:
                    field: component
                    type: nominal
                    limit: 8
                    legendOrientation: top
                  x:
                    field: __time
                    type: temporal
                    limit: 60
                  y:
                    field: total_cost
                    type: quantitative
                    zeroBasedOrigin: true
            height: 380px
  - items:
      - heatmap:
          metrics_view: metrics_margin_metrics
          x:
            type: nominal
            field: customer
            limit: 40
          y:
            type: nominal
            field: plan_name
            limit: 40
          color:
            type: quantitative
            field: gross_margin_percent
            colorRange:
              mode: scheme
              scheme: sequential
        width: 12
