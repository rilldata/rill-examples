type: canvas
tags: [canvas]
version: 1
display_name: "Cost Overview"

filters:
  enable: true
  pinned:
    - customer

defaults:
  time_range: P30D
  comparison_mode: time
  filters:
    customer: "zoom"

rows:
  - height: 80px
    items:
      - width: 12
        markdown:
          content: |
            # Cost Overview

            Focused view of **Total Cost** over time and across key dimensions.

  - height: 200px
    items:
      - width: 12
        kpi_grid:
          metrics_view: metrics_margin_metrics
          measures:
            - total_cost
          comparison:
            - percent_change
            - previous
          sparkline: right

  - height: 380px
    items:
      - width: 12
        line_chart:
          metrics_view: metrics_margin_metrics
          title: "Total Cost Over Time"
          x:
            field: __time
            type: temporal
          y:
            field: total_cost
            type: quantitative
            zeroBasedOrigin: true

  - height: 420px
    items:
      - width: 6
        bar_chart:
          description: ""
          metrics_view: metrics_margin_metrics
          title: Total Cost by Component
          x:
            field: component
            labelAngle: 0
            limit: 12
            sort: -y
            type: nominal
          y:
            field: total_cost
            type: quantitative
            zeroBasedOrigin: true

      - width: 6
        bar_chart:
          metrics_view: metrics_margin_metrics
          title: "Total Cost by Location"
          x:
            field: location
            type: nominal
            limit: 12
            sort: -y
            labelAngle: 0
          y:
            field: total_cost
            type: quantitative
            zeroBasedOrigin: true

  - height: 420px
    items:
      - width: 12
        table:
          metrics_view: metrics_margin_metrics
          title: "Cost by Customer"
          columns:
            - customer
            - total_cost
            - total_revenue
            - net_revenue
            - gross_margin_percent
          hide_totals_row: false
