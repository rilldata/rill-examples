type: canvas
version: 1
display_name: "Margin Metrics Overview"

defaults:
  time_range: P30D
  comparison_mode: time

rows:
  - items:
      - width: 12
        markdown:
          content: |
            # Margin Metrics Overview

            Key margin and cost metrics over the selected time range.
    height: 80px
  - items:
      - width: 12
        kpi_grid:
          metrics_view: metrics_margin_metrics
          measures:
            - total_revenue
            - total_cost
            - net_revenue
            - gross_margin_percent
          comparison:
            - percent_change
            - previous
          sparkline: right
    height: 200px
  - items:
      - donut_chart:
          metrics_view: metrics_margin_metrics
          innerRadius: 50
          show_other: true
          labels:
            show: true
            format: percent
            threshold: 5
          color:
            type: nominal
            field: customer
            limit: 20
            sort: -measure
          measure:
            type: quantitative
            field: total_cost
            showTotal: true
        width: 12
  - items:
      - bar_chart:
          metrics_view: metrics_margin_metrics
          color: primary
          x:
            type: temporal
            field: __time
            sort: -y
            limit: 20
          y:
            type: quantitative
            field: total_revenue
            zeroBasedOrigin: true
        width: 12
    height: 40px
  - items:
      - width: 12
        line_chart:
          metrics_view: metrics_margin_metrics
          title: Revenue vs Cost (Daily)
          color:
            field: rill_measures
            type: value
            legendOrientation: top
          x:
            field: __time
            type: temporal
          y:
            field: total_revenue
            fields:
              - total_revenue
              - total_cost
            type: quantitative
            zeroBasedOrigin: true
    height: 420px
  - items:
      - width: 6
        bar_chart:
          metrics_view: metrics_margin_metrics
          title: Net Revenue by Customer (Top 10)
          x:
            field: customer
            type: nominal
            limit: 10
            sort: -y
            labelAngle: -30
          y:
            field: net_revenue
            type: quantitative
            zeroBasedOrigin: true
      - width: 6
        bar_chart:
          metrics_view: metrics_margin_metrics
          title: Total Cost by Component (Top 10)
          x:
            field: component
            type: nominal
            limit: 10
            sort: -y
            labelAngle: -30
          y:
            field: total_cost
            type: quantitative
            zeroBasedOrigin: true
    height: 420px
  - items:
      - width: 12
        table:
          metrics_view: metrics_margin_metrics
          title: Customer / Plan Margin Detail
          columns:
            - customer
            - plan_name
            - total_revenue
            - total_cost
            - net_revenue
            - gross_margin_percent
          hide_totals_row: false
    height: 460px
