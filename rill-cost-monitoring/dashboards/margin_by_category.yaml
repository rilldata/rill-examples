type: canvas
display_name: "Margin by Category"

filters:
  enable: true
  pinned:
    - customer
    - plan_name
    - app_name
    - component
    - pipeline
    - sku_description
    - environment
    - location

defaults:
  time_range: P12W
  comparison_mode: time

max_width: 1400

time_ranges:
  - P4W
  - P12W
  - P26W
  - P52W
  - inf

rows:
  - name: category
    tabs:
      - label: "Profitability"
        name: profitability
        rows:
          - height: 72px
            items:
              - width: 12
                markdown:
                  content: |
                    # Profitability

                    Overall margin KPIs and trends.

          - height: 220px
            items:
              - width: 12
                kpi_grid:
                  metrics_view: metrics_margin_metrics_derived
                  title: "Key profitability KPIs"
                  measures:
                    - total_revenue
                    - net_revenue
                    - total_cost
                    - gross_margin_dollars
                    - gross_margin_percent
                    - cost_to_revenue_ratio
                  comparison:
                    - percent_change
                    - previous
                  sparkline: right

          - height: 420px
            items:
              - width: 12
                combo_chart:
                  metrics_view: metrics_margin_metrics_derived
                  title: "Net revenue and gross margin ($) — weekly"
                  time_filters: tr=P12W&compare_tr=rill-PP&grain=week
                  color:
                    field: measures
                    type: value
                    legendOrientation: top
                  x:
                    field: __time
                    type: temporal
                  y1:
                    field: net_revenue
                    type: quantitative
                    mark: bar
                    zeroBasedOrigin: true
                  y2:
                    field: gross_margin_dollars
                    type: quantitative
                    mark: line
                    zeroBasedOrigin: true

          - height: 420px
            items:
              - width: 6
                line_chart:
                  metrics_view: metrics_margin_metrics_derived
                  title: "Gross margin % — weekly"
                  time_filters: tr=P12W&compare_tr=rill-PP&grain=week
                  color: primary
                  x:
                    field: __time
                    type: temporal
                  y:
                    field: gross_margin_percent
                    type: quantitative
                    zeroBasedOrigin: false
              - width: 6
                line_chart:
                  metrics_view: metrics_margin_metrics_derived
                  title: "Cost to revenue ratio — weekly"
                  time_filters: tr=P12W&compare_tr=rill-PP&grain=week
                  color: secondary
                  x:
                    field: __time
                    type: temporal
                  y:
                    field: cost_to_revenue_ratio
                    type: quantitative
                    zeroBasedOrigin: false

          - height: 420px
            items:
              - width: 12
                table:
                  metrics_view: metrics_margin_metrics_derived
                  title: "Profitability detail"
                  time_filters: tr=P12W&grain=week
                  columns:
                    - customer
                    - plan_name
                    - app_name
                    - component
                    - pipeline
                    - sku_description
                    - environment
                    - location
                    - total_revenue
                    - net_revenue
                    - total_cost
                    - gross_margin_dollars
                    - gross_margin_percent
                    - cost_to_revenue_ratio

      - label: "Revenue"
        name: revenue
        rows:
          - height: 72px
            items:
              - width: 12
                markdown:
                  content: |
                    # Revenue

                    Revenue breakdowns and drivers.

          - height: 220px
            items:
              - width: 12
                kpi_grid:
                  metrics_view: metrics_margin_metrics_derived
                  title: "Revenue KPIs"
                  measures:
                    - total_revenue
                    - net_revenue
                    - gross_margin_dollars
                    - gross_margin_percent
                  comparison:
                    - percent_change
                    - previous
                  sparkline: right

          - height: 420px
            items:
              - width: 12
                line_chart:
                  metrics_view: metrics_margin_metrics_derived
                  title: "Total vs net revenue — weekly"
                  time_filters: tr=P12W&compare_tr=rill-PP&grain=week
                  color:
                    field: rill_measures
                    type: value
                    legendOrientation: top
                  x:
                    field: __time
                    type: temporal
                  y:
                    field: total_revenue
                    fields:
                      - total_revenue
                      - net_revenue
                    type: quantitative
                    zeroBasedOrigin: true

          - height: 420px
            items:
              - width: 6
                bar_chart:
                  metrics_view: metrics_margin_metrics_derived
                  title: "Top customers by net revenue"
                  x:
                    field: net_revenue
                    type: quantitative
                    zeroBasedOrigin: true
                  y:
                    field: customer
                    type: nominal
                    limit: 15
                    sort: -x
              - width: 6
                bar_chart:
                  metrics_view: metrics_margin_metrics_derived
                  title: "Top SKUs by net revenue"
                  x:
                    field: net_revenue
                    type: quantitative
                    zeroBasedOrigin: true
                  y:
                    field: sku_description
                    type: nominal
                    limit: 15
                    sort: -x

          - height: 420px
            items:
              - width: 12
                table:
                  metrics_view: metrics_margin_metrics_derived
                  title: "Revenue detail"
                  columns:
                    - customer
                    - plan_name
                    - app_name
                    - component
                    - pipeline
                    - sku_description
                    - environment
                    - location
                    - total_revenue
                    - net_revenue
                    - gross_margin_dollars
                    - gross_margin_percent

