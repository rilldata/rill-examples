                  color: primary
                  x:
                    field: __time
                    type: temporal
                  y:
                    field: total_cost
                    type: quantitative
                    zeroBasedOrigin: true

          - height: 420px
            items:
              - width: 6
                bar_chart:
                  metrics_view: metrics_margin_metrics_derived
                  title: "Top components by total cost"
                  x:
                    field: total_cost
                    type: quantitative
                    zeroBasedOrigin: true
                  y:
                    field: component
                    type: nominal
                    limit: 15
                    sort: -x
              - width: 6
                bar_chart:
                  metrics_view: metrics_margin_metrics_derived
                  title: "Top pipelines by total cost"
                  x:
                    field: total_cost
                    type: quantitative
                    zeroBasedOrigin: true
                  y:
                    field: pipeline
                    type: nominal
                    limit: 15
                    sort: -x

          - height: 420px
            items:
              - width: 12
                table:
                  metrics_view: metrics_margin_metrics_derived
                  title: "Cost detail"
                  columns:
                    - customer
                    - plan_name
                    - app_name
                    - component
