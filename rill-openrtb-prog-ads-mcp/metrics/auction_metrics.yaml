# Metrics view YAML
# Reference documentation: https://docs.rilldata.com/reference/project-files/dashboards

version: 1
model: "auction_data_model"
type: metrics_view
tags:
  - metrics_view
  - auction
  - programmatic_ads

timeseries: "__time"
smallest_time_grain: "hour"

security:
  access: true
  #row_filter: pub_name in (select pub_name from pub_user_mapping where user_email = '{{.user.email}}' )

annotations:
  - model: annotations_auction
    name: auction_annotations
    measures: ['requests']

measures:
  - display_name: Total Requests
    name: requests
    expression: sum(bid_request_cnt)
    description: Total Requests
    format_preset: humanize
    tags: [measure, auction, programmatic_ads]
  - display_name: "Avg Bid Floor"
    name: avg_bid_floor
    expression: "sum(bid_floor) / sum(has_bid_floor_cnt) "
    description: "Average Bid Floor"
    format_preset: currency_usd
    tags: [measure, auction, programmatic_ads]
  - display_name: "1D QPS"
    name: 1d_qps
    expression: "sum(bid_request_cnt) / 86400 "
    description: "1D QPS"
    format_preset: humanize
    tags: [measure, auction, programmatic_ads]

dimensions:
  - name: app_site_name
    display_name: App Site Name
    column: app_site_name
    description: ""
    tags: [dimension, auction, programmatic_ads]
