    height: 40px
  - items:
      - width: 12
        custom_chart:
          metrics_sql:
            - select edge from user_flow_mock_metrics
          vega_spec: |-
            {
              "$schema": "https://vega.github.io/schema/vega-lite/v6.json",
              "description": "A simple radial chart with embedded data.",
              "data": {
                "values": [
                  12,
                  23,
                  47,
                  6,
                  52,
                  19
                ]
              },
              "layer": [
                {
                  "mark": {
                    "type": "arc",
                    "innerRadius": 20,
                    "stroke": "#fff"
                  }
                },
                {
                  "mark": {
                    "type": "text",
                    "radiusOffset": 10
                  },
                  "encoding": {
                    "text": {
                      "field": "data",
                      "type": "quantitative"
                    }
                  }
                }
              ],
              "encoding": {
                "theta": {
                  "field": "data",
                  "type": "quantitative",
                  "stack": true
                },
                "radius": {
                  "field": "data",
                  "scale": {
                    "type": "sqrt",
                    "zero": true,
                    "rangeMin": 20
                  }
                },
                "color": {
                  "field": "data",
                  "type": "nominal",
                  "legend": null
                }
              }
            }
          metrics_view: user_flow_mock_metrics
