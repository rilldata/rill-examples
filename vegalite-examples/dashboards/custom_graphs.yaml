          metrics_view: user_flow_mock_metrics
          vega_spec: >-
            {
              "$schema": "https://vega.github.io/schema/vega-lite/v6.json",
              "description": "Vector array map showing wind speed and direction.",
              "width": 615,
              "height": 560,
              "data": {
                "url": "public/windvectors.csv",
                "format": {
                  "type": "csv",
                  "parse": {
                    "longitude": "number",
                    "latitude": "number"
                  }
                }
              },
              "projection": {
                "type": "equalEarth"
              },
              "mark": {
                "type": "point",
                "shape": "wedge",
                "filled": true
              },
              "encoding": {
                "longitude": {
                  "field": "longitude",
                  "type": "quantitative"
                },
                "latitude": {
                  "field": "latitude",
                  "type": "quantitative"
                },
                "color": {
                  "field": "dir",
                  "type": "quantitative",
                  "scale": {
                    "domain": [
                      0,
                      360
                    ],
                    "scheme": "rainbow"
                  },
                  "legend": null
                },
                "angle": {
                  "field": "dir",
                  "type": "quantitative",
                  "scale": {
                    "domain": [
                      0,
                      360
                    ],
                    "range": [
                      180,
                      540
                    ]
                  }
                },
                "size": {
                  "field": "speed",
                  "type": "quantitative",
                  "scale": {
                    "rangeMax": 500
                  }
                }
              },
              "config": {
                "aria": false,
                "view": {
                  "step": 10,
                  "fill": "black"
                }
              }
            }
      - width: 6
        custom_chart:
          metrics_sql:
            - select edge from user_flow_mock_metrics
          metrics_view: user_flow_mock_metrics
          vega_spec: >-
            {
              "$schema": "https://vega.github.io/schema/vega-lite/v6.json",
              "description": "A dot plot showing each movie in the database, and the difference from the average movie rating. The display is sorted by year to visualize everything in sequential order. The graph is for all Movies before 2019.",
              "data": {
                "url": "public/movies.json"
              },
              "transform": [
                {
                  "filter": "datum['IMDB Rating'] != null"
                },
                {
                  "filter": {
                    "timeUnit": "year",
                    "field": "Release Date",
                    "range": [
                      null,
                      2019
                    ]
                  }
                },
                {
                  "joinaggregate": [
                    {
                      "op": "mean",
                      "field": "IMDB Rating",
                      "as": "AverageRating"
                    }
                  ]
                },
                {
                  "calculate": "datum['IMDB Rating'] - datum.AverageRating",
                  "as": "RatingDelta"
                }
              ],
              "mark": "point",
              "encoding": {
                "x": {
                  "field": "Release Date",
                  "type": "temporal"
                },
                "y": {
                  "field": "RatingDelta",
                  "type": "quantitative",
                  "title": "Rating Delta"
                },
                "color": {
                  "field": "RatingDelta",
                  "type": "quantitative",
                  "scale": {
                    "domainMid": 0
                  },
                  "title": "Rating Delta"
                }
              }
            }
