# Explore YAML
# Reference documentation: https://docs.rilldata.com/reference/project-files/canvas-dashboards

type: canvas
display_name: Executive summary report
defaults:
  time_range: PT24H
  comparison_mode: time
rows:
  - items:
      - markdown:
          title: ""
          description: ""
          content: "# Executive summary report"
          alignment:
            horizontal: left
            vertical: middle
        width: 12
    height: 80px
  - items:
      - kpi_grid:
          metrics_view: bids_metrics
          measures:
            - overall_spend
            - total_bids
            - impressions
          comparison:
            - delta
            - percent_change
            - previous
          sparkline: right
          title: Bids
        width: 6
      - kpi_grid:
          metrics_view: auction_metrics
          measures:
            - requests
            - avg_bid_floor
            - 1d_qps
          comparison:
            - delta
            - percent_change
          sparkline: right
          title: Auctions
        width: 6
    height: 300px
  - items:
      - stacked_bar:
          metrics_view: bids_metrics
          description: ""
          color:
            field: device_type
            type: nominal
          vl_config: |-
            {
              "range": {
                "category": [
                  "#1f77b4",
                  "#ff7f0e",
                  "#2ca02c",
                  "#d62728",
                  "#9467bd",
                  "#8c564b",
                  "#e377c2",
                  "#7f7f7f",
                  "#bcbd22",
                  "#17becf"
                ]
              }
            }
          x:
            field: __time
            limit: 20
            sort: -y
            type: temporal
          y:
            field: overall_spend
            type: quantitative
            zeroBasedOrigin: true
        width: 6
      - donut_chart:
          metrics_view: auction_metrics
          innerRadius: 50
          show_other: true
          labels:
            show: true
            format: percent
            threshold: 5
          color:
            type: nominal
            field: device_type
            limit: 20
            sort: -measure
          measure:
            type: quantitative
            field: requests
            showTotal: true
        width: 6
    height: 320px
  - items:
      - combo_chart:
          color:
            field: measures
            legendOrientation: top
            type: value
          metrics_view: auction_metrics
          x:
            field: pub_name
            limit: 20
            type: nominal
          y1:
            field: 1d_qps
            mark: bar
            type: quantitative
            zeroBasedOrigin: true
          y2:
            field: avg_bid_floor
            mark: line
            type: quantitative
            zeroBasedOrigin: true
        width: 12
    height: 40px
  - items:
      - kpi_grid:
          metrics_view: auction_metrics
          measures:
            - requests
            - avg_bid_floor
            - 1d_qps
          comparison:
            - delta
            - percent_change
        width: 6
      - donut_chart:
          metrics_view: bids_metrics
          innerRadius: 50
          show_other: true
          labels:
            show: true
            format: percent
            threshold: 5
          color:
            field: advertiser_name
            type: nominal
            limit: 20
            sort: -measure
          measure:
            field: overall_spend
            type: quantitative
            showTotal: true
        width: 6
    height: 383px
  - items:
      - leaderboard:
          dimensions:
            - __time
            - another_time_column
            - app_site_name
          measures:
            - requests
          metrics_view: auction_metrics
          num_rows: 7
        width: 12
  - items:
      - combo_chart:
          color:
            field: measures
            legendOrientation: top
            type: value
            colorMapping:
              - value: Total Requests
                color: hsl(238, 56%, 52%)
          metrics_view: auction_metrics
          x:
            field: __time
            limit: 20
            sort: -y
            type: temporal
          y1:
            field: requests
            mark: bar
            type: quantitative
            zeroBasedOrigin: true
          y2:
            field: avg_bid_floor
            mark: line
            type: quantitative
            zeroBasedOrigin: true
        width: 6
      - stacked_bar:
          metrics_view: bids_metrics
          title: ""
          description: ""
          color:
            field: auction_type
            type: nominal
          x:
            field: bid_floor_bucket
            limit: 30
            showAxisTitle: true
            showNull: false
            sort: -x
            type: nominal
          y:
            field: win_rate
            type: quantitative
            zeroBasedOrigin: true
        width: 6
    height: 320px
  - items:
      - table:
          metrics_view: bids_metrics
          columns:
            - advertiser_name
            - overall_spend
            - total_bids
            - impressions
            - ctr
            - ecpm
          col_dimensions: []
          measures:
            - overall_spend
            - total_bids
            - impressions
            - win_rate
            - clicks
          row_dimensions:
            - advertiser_name
          time_filters: tr=P7D&compare_tr=rill-PW&grain=day
          title: Per advertiser metrics – last 7 days
        width: 12
    height: 300px
  - items:
      - scatter_plot:
          metrics_view: auction_metrics
          color: primary
          x:
            type: quantitative
            field: 1d_qps
            zeroBasedOrigin: false
          y:
            type: quantitative
            field: avg_bid_floor
            zeroBasedOrigin: false
          dimension:
            type: nominal
            field: ad_size
            limit: 10
        width: 6
      - combo_chart:
          metrics_view: auction_metrics
          x:
            field: __time
            limit: 20
            sort: -y
            type: temporal
          y1:
            type: quantitative
            field: 1d_qps
            zeroBasedOrigin: true
            mark: bar
          y2:
            type: quantitative
            field: requests
            zeroBasedOrigin: true
            mark: line
          color:
            type: value
            field: measures
            legendOrientation: top
        width: 6
    height: 40px
