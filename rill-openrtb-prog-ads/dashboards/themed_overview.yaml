# Explore YAML
# Reference documentation: https://docs.rilldata.com/reference/project-files/canvas-dashboards

type: canvas
display_name: "[Themed] Executive summary report"
defaults:
  time_range: PT24H
  comparison_mode: time

rows:
  - items:
      - markdown:
          title: ""
          description: ""
          content: "# Executive summary report"
          alignment:
            horizontal: left
            vertical: middle
        width: 12
    height: 80px
  - items:
      - kpi_grid:
          metrics_view: bids_metrics
          measures:
            - overall_spend
            - total_bids
            - impressions
          comparison:
            - delta
            - percent_change
            - previous
          sparkline: right
          title: Bids
        width: 6
      - kpi_grid:
          metrics_view: auction_metrics
          measures:
            - requests
            - avg_bid_floor
            - 1d_qps
          comparison:
            - delta
            - percent_change
          sparkline: right
          title: Auctions
        width: 6
    height: 300px
  - items:
      - stacked_bar:
          metrics_view: bids_metrics
          description: ""
          color:
            field: device_type
            type: nominal
          x:
            field: __time
            limit: 20
            sort: -y
            type: temporal
          y:
            field: overall_spend
            type: quantitative
            zeroBasedOrigin: true
        width: 12
    height: 320px
  - items:
      - stacked_bar:
          metrics_view: bids_metrics
          title: ""
          description: ""
          color:
            field: auction_type
            type: nominal
          x:
            field: bid_floor_bucket
            limit: 30
            showAxisTitle: true
            showNull: false
            sort: -x
            type: nominal
          y:
            field: win_rate
            type: quantitative
            zeroBasedOrigin: true
        width: 6
      - donut_chart:
          metrics_view: auction_metrics
          innerRadius: 50
          show_other: true
          labels:
            show: true
            format: percent
            threshold: 5
          color:
            type: nominal
            field: video_min_duration_bucket
            limit: 20
            sort: -measure
          measure:
            type: quantitative
            field: requests
            showTotal: true
        width: 6
    height: 320px
  - items:
      - combo_chart:
          metrics_view: auction_metrics
          x:
            type: temporal
            field: __time
            sort: -y
            limit: 20
          y1:
            type: quantitative
            field: 1d_qps
            zeroBasedOrigin: true
            mark: bar
          y2:
            type: quantitative
            field: avg_bid_floor
            zeroBasedOrigin: true
            mark: line
          color:
            type: value
            field: measures
            legendOrientation: top
        width: 12
  - items:
      - table:
          metrics_view: bids_metrics
          columns:
            - advertiser_name
            - overall_spend
            - total_bids
            - impressions
            - ctr
            - ecpm
          col_dimensions: []
          measures:
            - overall_spend
            - total_bids
            - impressions
            - win_rate
            - clicks
          row_dimensions:
            - advertiser_name
          time_filters: tr=P7D&compare_tr=rill-PW&grain=day
          title: Per advertiser metrics – last 7 days
        width: 12
    height: 300px
theme: theme
