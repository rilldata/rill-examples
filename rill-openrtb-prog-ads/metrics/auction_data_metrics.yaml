# Metrics view YAML
# Reference documentation: https://docs.rilldata.com/reference/project-files/metrics-views
# This file was generated using AI.

version: 1
type: metrics_view 

display_name: Auction Data
connector: duckdb
model: auction_data
timeseries: __time

dimensions:
  - name: app_site_name
    display_name: App Site Name
    column: app_site_name
  - name: app_site_domain
    display_name: App Site Domain
    column: app_site_domain
  - name: pub_name
    display_name: Pub Name
    column: pub_name
  - name: app_site_cat
    display_name: App Site Cat
    column: app_site_cat
  - name: ad_size
    display_name: Ad Size
    column: ad_size
  - name: device_region
    display_name: Device Region
    column: device_region
  - name: device_osv
    display_name: Device Osv
    column: device_osv
  - name: bid_floor_bucket
    display_name: Bid Floor Bucket
    column: bid_floor_bucket
  - name: platform_browser
    display_name: Platform Browser
    column: platform_browser
  - name: device_os
    display_name: Device Os
    column: device_os
  - name: device_type
    display_name: Device Type
    column: device_type
  - name: ad_position
    display_name: Ad Position
    column: ad_position
  - name: video_max_duration_bucket
    display_name: Video Max Duration Bucket
    column: video_max_duration_bucket
  - name: video_min_duration_bucket
    display_name: Video Min Duration Bucket
    column: video_min_duration_bucket
  - name: placement_type
    display_name: Placement Type
    column: placement_type
  - name: auction_type
    display_name: Auction Type
    column: auction_type
  - name: app_or_site
    display_name: App Or Site
    column: app_or_site
  - name: __time
    display_name: Time
    column: __time

measures:
  - name: total_rows_measure_measure
    display_name: Total Rows
    expression: COUNT(*)
    description: Total number of records in auction_data.
    format_preset: humanize
  - name: total_bid_requests_measure_measure
    display_name: Total Bid Requests
    expression: SUM(bid_request_cnt)
    description: Sum of bid requests across all records.
    format_preset: humanize
  - name: average_bid_requests_per_row_measure_measure
    display_name: Average Bid Requests per Row
    expression: AVG(bid_request_cnt)
    description: Average bid_request_cnt value per record.
    format_preset: humanize
  - name: total_has_bid_floor_count_measure_measure
    display_name: Total Has Bid Floor Count
    expression: SUM(has_bid_floor_cnt)
    description: Total count of records/requests flagged as having a bid floor (summed from has_bid_floor_cnt).
    format_preset: humanize
  - name: average_bid_floor_measure_measure
    display_name: Average Bid Floor
    expression: AVG(bid_floor)
    description: Average bid floor value across all records.
    format_preset: humanize
  - name: minimum_bid_floor_measure_measure
    display_name: Minimum Bid Floor
    expression: MIN(bid_floor)
    description: Lowest bid floor value observed.
    format_preset: humanize
  - name: maximum_bid_floor_measure_measure
    display_name: Maximum Bid Floor
    expression: MAX(bid_floor)
    description: Highest bid floor value observed.
    format_preset: humanize
  - name: distinct_publishers_measure_measure
    display_name: Distinct Publishers
    expression: COUNT(DISTINCT pub_name)
    description: Number of unique publishers (pub_name) represented in the data.
    format_preset: humanize
