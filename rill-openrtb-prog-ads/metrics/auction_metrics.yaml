# Metrics view YAML
# Reference documentation: https://docs.rilldata.com/reference/project-files/dashboards

version: 1
model: "auction_data_model"
type: metrics_view
tags:
  - metrics_view
  - auction
  - programmatic_ads

timeseries: "__time"
smallest_time_grain: "hour"

security:
  access: >-
    {{- $mode := get .user "embed_security_mode" -}}
    {{- if not (hasKey .user "embed_security_mode") -}}
    true
    {{- else if not (kindIs "string" $mode) -}}
    false
    {{- else if eq $mode "user_domain" -}}
    {{ and (kindIs "string" .user.domain) (eq .user.domain "rilldata.com") }}
    {{- else if eq $mode "site_domain" -}}
    {{ and (kindIs "string" .user.domain) (not (empty .user.domain)) }}
    {{- else -}}
    false
    {{- end -}}
  row_filter: >-
    {{- $mode := get .user "embed_security_mode" | toString -}}
    {{- if not (hasKey .user "embed_security_mode") -}}
    true
    {{- else if eq $mode "user_domain" -}}
    true
    {{- else if eq $mode "site_domain" -}}
    app_site_domain = '{{ .user.domain | toString | replace "'" "''" }}'
    {{- else -}}
    false
    {{- end -}}
  rules:
    # Deny explicitly whenever the access condition above is false. An access condition only adds access,
    # so it cannot remove the access that a dashboard-scoped embed token grants to its metrics view.
    - type: access
      action: deny
      if: >-
        {{- $mode := get .user "embed_security_mode" -}}
        {{- if not (hasKey .user "embed_security_mode") -}}
        false
        {{- else if not (kindIs "string" $mode) -}}
        true
        {{- else if eq $mode "user_domain" -}}
        {{ not (and (kindIs "string" .user.domain) (eq .user.domain "rilldata.com")) }}
        {{- else if eq $mode "site_domain" -}}
        {{ not (and (kindIs "string" .user.domain) (not (empty .user.domain))) }}
        {{- else -}}
        true
        {{- end -}}

annotations:
  - model: annotations_auction
    name: auction_annotations
    measures: ['requests']

measures:
  - display_name: Total Requests
    name: requests
    expression: sum(bid_request_cnt)
    description: Total Requests
    format_preset: humanize
    tags: [measure, auction, programmatic_ads]
  - display_name: "Avg Bid Floor"
    name: avg_bid_floor
    expression: "sum(bid_floor) / sum(has_bid_floor_cnt) "
    description: "Average Bid Floor"
    format_preset: currency_usd
    tags: [measure, auction, programmatic_ads]
  - display_name: "1D QPS"
    name: 1d_qps
    expression: "sum(bid_request_cnt) / 86400 "
    description: "1D QPS"
    format_preset: humanize
    tags: [measure, auction, programmatic_ads]

