display_name: Rill Embedding Example Project

olap_connector: duckdb

# Mock users for testing the project's security policies.
mock_users:
  # User with email domain that matches data in auctions_security_domain
  - email: jane@fubo.tv

  # User with custom attributes that matches data in auctions_security_custom_attributes
  - email: custom-fubo-taboola@example.com
    app_site_name: FuboTV
    pub_name: Taboola

  # User with custom attributes that matches data in auctions_security_custom_attributes
  - email: custom-sling-taboola@example.com
    app_site_name: Sling
    pub_name: Taboola

# Customize available features.
# Note the use of .user.embed to disable certain features in embeds.
features:
  dashboard_chat: true
  exports: true
  cloud_editing: true
  # Enable explicitly, they are disabled in embeds by default
  reports: true
  alerts: true
  # Enable since these are disabled by default
  personal_canvases: true
  embedded_bookmarks: true

# Page in the embedding app that opens dashboards from the "Open" link in
# report and alert emails created in embeds. Rill appends a rill_open query
# parameter. See web/src/app/user-features/open/page.tsx.
embeds:
  open_url: https://rill-embedding-example.netlify.app/user-features/open
